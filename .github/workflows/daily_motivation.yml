name: Dagelijkse Triathlon Motivatie

on:
  schedule:
    - cron: '15 14 * * 1-5'   # Ma–Vr 16:15 CEST
    - cron: '0 5 * * 6,0'     # Za–Zo 07:00 CEST
    - cron: '0 10 * * *'      # Elke dag 12:00 CEST check
  workflow_dispatch:

jobs:
  motivatie:
    runs-on: ubuntu-latest
    steps:
      - name: Code ophalen via publieke URL (geen checkout nodig)
        run: |
          wget -q https://github.com/jdumoulinostyn/triathlon-motivation/archive/refs/heads/main.zip
          unzip -q main.zip
          cd triathlon-motivation-main
          pip install -e . --quiet

      - name: Uitvoeren
        env:
          TP_AUTH_COOKIE: ${{ secrets.TP_AUTH_COOKIE }}
        run: |
          cd triathlon-motivation-main

          # Tijdvenster: sla over als GitHub Actions meer dan 1u te laat startte.
          # Voorkomt notificaties om 23u bij een voor 16:15 geplande run.
          SCHEDULE="${{ github.event.schedule }}"
          if [ -n "$SCHEDULE" ]; then
            NOW=$(date -u +%H%M)
            SKIP=false
            [[ "$SCHEDULE" = "15 14 * * 1-5" && "$NOW" > "1514" ]] && SKIP=true
            [[ "$SCHEDULE" = "0 5 * * 6,0"   && "$NOW" > "0559" ]] && SKIP=true
            [[ "$SCHEDULE" = "0 10 * * *"    && "$NOW" > "1059" ]] && SKIP=true
            if [ "$SKIP" = "true" ]; then
              echo "⏰ Te laat gestart ($(date -u '+%H:%M') UTC) — notificatie overgeslagen."
              exit 0
            fi
            echo "✓ Tijdvenster OK ($(date -u '+%H:%M') UTC)."
          fi

          if [ "${{ github.event.schedule }}" = "0 10 * * *" ]; then
            python3 daily_motivation.py --check-tomorrow
          else
            python3 daily_motivation.py
          fi
