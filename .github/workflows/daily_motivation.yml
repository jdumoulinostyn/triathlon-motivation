name: Dagelijkse Triathlon Motivatie

on:
  schedule:
    - cron: '15 14 * * 1-5'   # Ma–Vr 16:15 CEST
    - cron: '0 5 * * 6,0'     # Za–Zo 07:00 CEST
    - cron: '0 10 * * *'      # Elke dag 12:00 CEST check
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode: main of check-tomorrow'
        required: false
        default: 'main'

jobs:
  motivatie:
    runs-on: ubuntu-latest
    steps:
      - name: Code ophalen via publieke URL (geen checkout nodig)
        run: |
          wget -q https://github.com/jdumoulinostyn/triathlon-motivation/archive/refs/heads/main.zip
          unzip -q main.zip
          cd triathlon-motivation-main
          pip install -e . --quiet

      - name: Uitvoeren
        env:
          TP_AUTH_COOKIE: ${{ secrets.TP_AUTH_COOKIE }}
        run: |
          cd triathlon-motivation-main

          # Tijdvenster check: alleen voor schedule-runs (GitHub Actions loopt 7-9u achter).
          # workflow_dispatch via cron-job.org heeft dit niet nodig — die start direct.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            NOW=$(date -u +%H%M)
            SKIP=false
            [[ "${{ github.event.schedule }}" = "15 14 * * 1-5" && "$NOW" > "1514" ]] && SKIP=true
            [[ "${{ github.event.schedule }}" = "0 5 * * 6,0"   && "$NOW" > "0559" ]] && SKIP=true
            [[ "${{ github.event.schedule }}" = "0 10 * * *"    && "$NOW" > "1059" ]] && SKIP=true
            if [ "$SKIP" = "true" ]; then
              echo "⏰ Te laat gestart ($(date -u '+%H:%M') UTC) via schedule — overgeslagen."
              exit 0
            fi
            echo "✓ Tijdvenster OK ($(date -u '+%H:%M') UTC)."
          else
            echo "✓ Gestart via workflow_dispatch — $(date -u '+%H:%M') UTC."
          fi

          MODE="${{ github.event.inputs.mode }}"
          if [ "${{ github.event.schedule }}" = "0 10 * * *" ] || [ "$MODE" = "check-tomorrow" ]; then
            python3 daily_motivation.py --check-tomorrow
          elif [ "$MODE" = "test" ]; then
            python3 daily_motivation.py --test
          else
            python3 daily_motivation.py
          fi
