name: Dagelijkse Triathlon Motivatie

on:
  schedule:
    - cron: '15 14 * * 1-5'   # Ma–Vr 16:15 CEST
    - cron: '0 5 * * 6,0'     # Za–Zo 07:00 CEST
    - cron: '0 11 * * *'      # Elke dag 13:00 CEST check
  workflow_dispatch:

jobs:
  motivatie:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -e . --quiet

      - name: Uitvoeren
        env:
          TP_AUTH_COOKIE: ${{ secrets.TP_AUTH_COOKIE }}
        run: |
          if [ "${{ github.event.schedule }}" = "0 11 * * *" ]; then
            python daily_motivation.py --check-tomorrow
          else
            python daily_motivation.py
          fi
