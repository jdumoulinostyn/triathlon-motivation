name: Dagelijkse Triathlon Motivatie

on:
  schedule:
    - cron: '15 14 * * 1-5'   # Ma–Vr 16:15 CEST
    - cron: '0 5 * * 6,0'     # Za–Zo 07:00 CEST
    - cron: '0 11 * * *'      # Elke dag 13:00 CEST check
  workflow_dispatch:

jobs:
  motivatie:
    runs-on: ubuntu-latest
    steps:
      - name: Code ophalen via publieke URL (geen checkout nodig)
        run: |
          wget -q https://github.com/jdumoulinostyn/triathlon-motivation/archive/refs/heads/main.zip
          unzip -q main.zip
          cd triathlon-motivation-main
          pip install -e . --quiet

      - name: Uitvoeren
        env:
          TP_AUTH_COOKIE: ${{ secrets.TP_AUTH_COOKIE }}
        run: |
          cd triathlon-motivation-main
          if [ "${{ github.event.schedule }}" = "0 11 * * *" ]; then
            python3 daily_motivation.py --check-tomorrow
          else
            python3 daily_motivation.py
          fi
