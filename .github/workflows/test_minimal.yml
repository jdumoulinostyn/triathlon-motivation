name: Minimal Test

on:
  workflow_dispatch:
  schedule:
    - cron: '37 12 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Bestanden ophalen via publieke URL (geen checkout)
        run: |
          wget -q https://github.com/jdumoulinostyn/triathlon-motivation/archive/refs/heads/main.zip
          unzip -q main.zip
          ls triathlon-motivation-main/

      - name: Python versie controleren
        run: python3 --version

      - run: echo "Werkt zonder checkout!"
